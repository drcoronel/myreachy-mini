[project]
name = "reachy-mini-experiments"
version = "0.1.0"
description = "Experiments and apps for Reachy Mini wireless"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Face detection
    "insightface>=0.7",
    "onnxruntime>=1.18",
    # AI providers
    "google-generativeai>=0.8",
    "ollama>=0.4",
    # Web / API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    # Utils
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "httpx>=0.28",
    "Pillow>=11",
    "numpy>=2",
    "opencv-python-headless>=4.10",
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "sounddevice>=0.5.5",
    "silero-vad>=6.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "services", "apps"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
